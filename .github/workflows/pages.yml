name: Build slides and publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc make \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern fonts-open-sans fonts-noto-mono
          fc-cache -f

      - name: Build PDFs
        run: make pdf

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html 0*.pdf _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
